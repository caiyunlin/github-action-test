name: Update ACA Temporal API Key

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to update
        required: true
        type: choice
        default: ga-nonp
        options:
          - ga-nonp
          - ga-prod
          - preview
      update_temporal_api_key:
        description: Copy the Temporal API key and restart the Container App
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: update-aca-temporal-api-key-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  update-aca-secret:
    name: Update ACA secret for ${{ github.event.inputs.environment }}
    if: github.event.inputs.environment != 'preview' && github.event.inputs.update_temporal_api_key == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      AZURE_SUBSCRIPTION_ID: 3c8fddff-d394-45bb-984a-19fb452e9cd2
      KEY_VAULT_NAME: mykv0224
      SOURCE_SECRET_NAME: temporal-api-key-source
      TARGET_SECRET_NAME: temporal-api-key
      TARGET_SECRET_URL: https://mykv0224.vault.azure.net/secrets/temporal-api-key
      ACA_RESOURCE_GROUP: aca-rg
      ACA_NAME: aca-hello
      ACA_CONTAINER_NAME: simple-hello-world-container
      ACA_SECRET_NAME: temporal-api-key
      ACA_ENVIRONMENT_VARIABLE: TEMPORAL_API_KEY
      ACA_KEY_VAULT_IDENTITY: /subscriptions/3c8fddff-d394-45bb-984a-19fb452e9cd2/resourceGroups/aca-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/aca-hello-keyvault-identity
      ACA_RESOURCE_ID: /subscriptions/3c8fddff-d394-45bb-984a-19fb452e9cd2/resourceGroups/aca-rg/providers/Microsoft.App/containerApps/aca-hello
      ACA_API_VERSION: 2024-03-01

    steps:
      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Container App secret references
        shell: bash
        run: |
          set -euo pipefail

          APP_JSON=$(az containerapp show \
            --name "$ACA_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --output json \
            --only-show-errors)

          LATEST_REVISION=$(jq -r '.properties.latestRevisionName // empty' <<< "$APP_JSON")
          KEY_VAULT_URL=$(jq -r \
            --arg secretName "$ACA_SECRET_NAME" \
            '.properties.configuration.secrets[]? | select(.name == $secretName) | .keyVaultUrl // empty' \
            <<< "$APP_JSON")
          KEY_VAULT_IDENTITY=$(jq -r \
            --arg secretName "$ACA_SECRET_NAME" \
            '.properties.configuration.secrets[]? | select(.name == $secretName) | .identity // empty' \
            <<< "$APP_JSON")
          ENVIRONMENT_SECRET_REF=$(jq -r \
            --arg containerName "$ACA_CONTAINER_NAME" \
            --arg environmentName "$ACA_ENVIRONMENT_VARIABLE" \
            '.properties.template.containers[]? | select(.name == $containerName) | .env[]? | select(.name == $environmentName) | .secretRef // empty' \
            <<< "$APP_JSON")

          if [ -z "$LATEST_REVISION" ]; then
            echo "Container App has no latest revision"
            exit 1
          fi
          if [ "${KEY_VAULT_URL%/}" != "${TARGET_SECRET_URL%/}" ]; then
            echo "ACA secret '$ACA_SECRET_NAME' does not reference the expected Key Vault URL"
            exit 1
          fi
          if [ "${KEY_VAULT_IDENTITY,,}" != "${ACA_KEY_VAULT_IDENTITY,,}" ]; then
            echo "ACA secret '$ACA_SECRET_NAME' does not use the expected managed identity"
            exit 1
          fi
          if ! jq -e \
            --arg identity "$ACA_KEY_VAULT_IDENTITY" \
            '($identity | ascii_downcase) as $expected | (.identity.userAssignedIdentities // {} | keys | map(ascii_downcase) | index($expected)) != null' \
            <<< "$APP_JSON" > /dev/null; then
            echo "The expected managed identity is not assigned to the Container App"
            exit 1
          fi
          if [ "$ENVIRONMENT_SECRET_REF" != "$ACA_SECRET_NAME" ]; then
            echo "Environment variable '$ACA_ENVIRONMENT_VARIABLE' does not reference ACA secret '$ACA_SECRET_NAME'"
            exit 1
          fi

          echo "ACA_REVISION_NAME=$LATEST_REVISION" >> "$GITHUB_ENV"
          echo "Validated ACA Key Vault and environment-variable references"

      - name: Read source Key Vault secret
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_VALUE=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name "$SOURCE_SECRET_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --query value \
            --output tsv \
            --only-show-errors)

          if [ -z "$SOURCE_VALUE" ]; then
            echo "Source Key Vault secret is empty"
            exit 1
          fi
          if [[ "$SOURCE_VALUE" == *$'\n'* || "$SOURCE_VALUE" == *$'\r'* ]]; then
            echo "Source Key Vault secret must be a single-line value"
            exit 1
          fi

          echo "::add-mask::$SOURCE_VALUE"
          printf 'TEMPORAL_API_KEY=%s\n' "$SOURCE_VALUE" >> "$GITHUB_ENV"
          echo "Source Key Vault secret loaded"

      - name: Update and validate target Key Vault secret
        shell: bash
        run: |
          set -euo pipefail

          az keyvault secret set \
            --vault-name "$KEY_VAULT_NAME" \
            --name "$TARGET_SECRET_NAME" \
            --value "$TEMPORAL_API_KEY" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --output none \
            --only-show-errors

          TARGET_VALUE=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name "$TARGET_SECRET_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --query value \
            --output tsv \
            --only-show-errors)
          echo "::add-mask::$TARGET_VALUE"

          if [ "$TARGET_VALUE" != "$TEMPORAL_API_KEY" ]; then
            echo "Target Key Vault secret does not match the source secret"
            exit 1
          fi
          echo "Target Key Vault secret updated and validated"

      - name: Restart latest Container App revision
        shell: bash
        run: |
          set -euo pipefail

          az containerapp revision restart \
            --name "$ACA_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --revision "$ACA_REVISION_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --only-show-errors
          echo "Restart requested for revision $ACA_REVISION_NAME"

      - name: Validate revision health and resolved secret
        shell: bash
        run: |
          set -euo pipefail

          DEADLINE=$((SECONDS + 300))
          LAST_HEALTH=""
          LAST_PROVISIONING=""
          LAST_RUNNING=""

          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            REVISION_JSON=$(az containerapp revision show \
              --name "$ACA_NAME" \
              --resource-group "$ACA_RESOURCE_GROUP" \
              --revision "$ACA_REVISION_NAME" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --output json \
              --only-show-errors)

            LAST_HEALTH=$(jq -r '.properties.healthState // empty' <<< "$REVISION_JSON")
            LAST_PROVISIONING=$(jq -r '.properties.provisioningState // empty' <<< "$REVISION_JSON")
            LAST_RUNNING=$(jq -r '.properties.runningState // empty' <<< "$REVISION_JSON")

            RESOLVED_VALUE=$(az rest \
              --method post \
              --url "https://management.azure.com${ACA_RESOURCE_ID}/listSecrets?api-version=${ACA_API_VERSION}" \
              --query "value[?name=='${ACA_SECRET_NAME}'].value | [0]" \
              --output tsv \
              --only-show-errors)

            if [ -n "$RESOLVED_VALUE" ]; then
              echo "::add-mask::$RESOLVED_VALUE"
            fi

            case "$LAST_RUNNING" in
              Running|RunningAtMaxScale|ScaledToZero)
                RUNNING_OK=true
                ;;
              *)
                RUNNING_OK=false
                ;;
            esac

            if [ "$RESOLVED_VALUE" = "$TEMPORAL_API_KEY" ] \
              && [ "$LAST_HEALTH" = "Healthy" ] \
              && [ "$LAST_PROVISIONING" = "Provisioned" ] \
              && [ "$RUNNING_OK" = true ]; then
              echo "Container App resolved secret matches Key Vault and revision is healthy"
              {
                echo "## ACA Temporal API Key Update"
                echo ""
                echo "- Environment: ${{ github.event.inputs.environment }}"
                echo "- Container App: $ACA_NAME"
                echo "- Revision: $ACA_REVISION_NAME"
                echo "- Secret comparison: matched"
                echo "- Health: $LAST_HEALTH"
                echo "- Provisioning: $LAST_PROVISIONING"
                echo "- Running: $LAST_RUNNING"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$LAST_HEALTH" = "Unhealthy" ] \
              || [ "$LAST_PROVISIONING" = "Failed" ] \
              || [ "$LAST_RUNNING" = "Failed" ]; then
              echo "Revision entered a failed state: health=$LAST_HEALTH provisioning=$LAST_PROVISIONING running=$LAST_RUNNING"
              exit 1
            fi

            echo "Waiting for ACA secret refresh: health=$LAST_HEALTH provisioning=$LAST_PROVISIONING running=$LAST_RUNNING"
            sleep 10
          done

          echo "Timed out waiting for ACA secret refresh: health=$LAST_HEALTH provisioning=$LAST_PROVISIONING running=$LAST_RUNNING"
          exit 1
