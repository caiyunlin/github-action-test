name: Update ACA Temporal API Key

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to update
        required: true
        type: choice
        default: ga-nonp
        options:
          - ga-nonp
          - ga-prod
          - preview
      update_temporal_api_key:
        description: Copy the Temporal API key and restart the Container App
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: update-aca-temporal-api-key-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  update-aca-secret:
    name: Update ACA secret for ${{ github.event.inputs.environment }}
    if: github.event.inputs.environment != 'preview' && github.event.inputs.update_temporal_api_key == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment }}
      AZURE_SUBSCRIPTION_ID: 3c8fddff-d394-45bb-984a-19fb452e9cd2
      KEY_VAULT_NAME: mykv0224
      SOURCE_SECRET_NAME: temporal-api-key-source
      TARGET_SECRET_NAME: temporal-api-key
      TARGET_SECRET_URL: https://mykv0224.vault.azure.net/secrets/temporal-api-key
      ACA_RESOURCE_GROUP: aca-rg
      ACA_NAME: aca-hello
      ACA_CONTAINER_NAME: simple-hello-world-container
      ACA_SECRET_NAME: temporal-api-key
      ACA_ENVIRONMENT_VARIABLE: TEMPORAL_API_KEY
      ACA_KEY_VAULT_IDENTITY: /subscriptions/3c8fddff-d394-45bb-984a-19fb452e9cd2/resourceGroups/aca-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/aca-hello-keyvault-identity

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: update_key_vault_secret/go.mod
          cache-dependency-path: |
            update_key_vault_secret/go.sum
            validate_container_app_secret_references/go.sum
            validate_container_app_secret/go.sum

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Container App secret references
        working-directory: validate_container_app_secret_references
        run: |
          set -euo pipefail
          go build -o validate-container-app-secret-references .
          ./validate-container-app-secret-references

      - name: Read source Key Vault secret
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_VALUE=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name "$SOURCE_SECRET_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --query value \
            --output tsv \
            --only-show-errors)

          if [ -z "$SOURCE_VALUE" ]; then
            echo "Source Key Vault secret is empty"
            exit 1
          fi
          if [[ "$SOURCE_VALUE" == *$'\n'* || "$SOURCE_VALUE" == *$'\r'* ]]; then
            echo "Source Key Vault secret must be a single-line value"
            exit 1
          fi

          echo "::add-mask::$SOURCE_VALUE"
          printf 'TEMPORAL_API_KEY=%s\n' "$SOURCE_VALUE" >> "$GITHUB_ENV"
          echo "Source Key Vault secret loaded"

      - name: Update and validate target Key Vault secret
        working-directory: update_key_vault_secret
        run: |
          set -euo pipefail
          go build -o update-key-vault-secret .
          ./update-key-vault-secret

      - name: Restart latest Container App revision
        shell: bash
        run: |
          set -euo pipefail

          az containerapp revision restart \
            --name "$ACA_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --revision "$ACA_REVISION_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --only-show-errors
          echo "Restart requested for revision $ACA_REVISION_NAME"

      - name: Validate revision health and resolved secret
        working-directory: validate_container_app_secret
        run: |
          set -euo pipefail
          go build -o validate-container-app-secret .
          ./validate-container-app-secret
